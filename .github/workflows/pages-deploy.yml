name: "[04] Build pages and deploy"

on:
  push:
    branches: ["main"]
    paths:
      - 'web/**'
      - 'wasm/**'
      - 'pkg/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/pages-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
      wasm_smoke: ${{ steps.wasm-smoke.outcome }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build WASM
        run: |
          engine_version="${GITHUB_SHA}"
          mkdir -p web/public
          GOOS=js GOARCH=wasm go build -trimpath -ldflags="-s -w" \
            -o "web/public/vdex.${engine_version}.wasm" ./wasm/
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" \
            "web/public/wasm_exec.${engine_version}.js"
          printf 'VITE_ENGINE_VERSION=%s\n' "$engine_version" >> "$GITHUB_ENV"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: ./web
        run: npm ci

      - name: Test WASM bridge
        id: wasm-smoke
        working-directory: ./web
        run: >-
          node scripts/wasm-smoke.mjs
          "public/vdex.${VITE_ENGINE_VERSION}.wasm"
          "public/wasm_exec.${VITE_ENGINE_VERSION}.js"

      - name: Build Web App
        working-directory: ./web
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: './web/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

  summary:
    name: "summary"
    if: always()
    needs: deploy
    runs-on: ubuntu-latest
    env:
      DEPLOY_RESULT: ${{ needs.deploy.result }}
      PAGE_URL: ${{ needs.deploy.outputs.page_url }}
      WASM_SMOKE: ${{ needs.deploy.outputs.wasm_smoke }}
    steps:
      - name: Write workflow summary
        run: |
          short_sha="${GITHUB_SHA::7}"
          page_url="${PAGE_URL:-unavailable}"
          {
            echo "## GitHub Pages Deployment"
            echo
            echo "| Item | Value |"
            echo "| --- | --- |"
            printf '| Result | `%s` |\n' "$DEPLOY_RESULT"
            printf '| Node.js | `24` |\n'
            printf '| Go version | `go.mod` |\n'
            printf '| WASM bridge | `%s` |\n' "${WASM_SMOKE:-unavailable}"
            printf '| Base path | `/vdexcli/` |\n'
            printf '| Deployment | %s |\n' "$page_url"
            echo
            echo "### Run"
            printf -- '- Event: `%s`\n' "$GITHUB_EVENT_NAME"
            printf -- '- Ref: `%s`\n' "$GITHUB_REF_NAME"
            printf -- '- Commit: [`%s`](%s/%s/commit/%s)\n' "$short_sha" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

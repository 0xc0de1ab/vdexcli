name: "[02] Bump up"

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Next version tag (e.g. v1.0.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Verify main branch source
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Version tags must be created from the protected main branch"
            exit 1
          fi
          git fetch --no-tags origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "::error::Checked-out commit does not match origin/main"
            exit 1
          fi

      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must match vMAJOR.MINOR.PATCH"
            exit 1
          fi

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and push tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git tag "$VERSION"
          git push origin "$VERSION"

      - name: Write workflow summary
        if: always()
        env:
          RESULT: ${{ job.status }}
          VERSION: ${{ inputs.version }}
        run: |
          short_sha="${GITHUB_SHA::7}"
          {
            echo "## Version Tag"
            echo
            echo "| Item | Value |"
            echo "| --- | --- |"
            printf '| Result | `%s` |\n' "$RESULT"
            printf '| Tag | `%s` |\n' "$VERSION"
            printf '| Release trigger | `tag push` |\n'
            printf '| Source ref | `%s` |\n' "$GITHUB_REF_NAME"
            printf '| Commit | [`%s`](%s/%s/commit/%s) |\n' "$short_sha" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_SHA"
            printf '| Triggered by | `%s` |\n' "$GITHUB_ACTOR"
          } >> "$GITHUB_STEP_SUMMARY"
